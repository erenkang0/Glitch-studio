name: Android Release APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          path=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built APK: $path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch-studio-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish rolling prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Glitch Studio (latest build)
          body: |
            Automated release APK built from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            This APK is signed with a debug key for sideloading. To install, enable
            "Install unknown apps" for your browser/file manager, then open the APK.
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
