org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 enables built-in Kotlin by default; keep the classic external Kotlin
# Gradle plugin (org.jetbrains.kotlin.android) to avoid a double-apply conflict.
android.builtInKotlin=false
# compileSdk 37 is newer than AGP's tested set; silence the soft warning.
android.suppressUnsupportedCompileSdk=37
